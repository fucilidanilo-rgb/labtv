
<nav class="navbar">
  <div class="navbar-left">

    <!-- LOGO -->
    <a routerLink="/" class="brand">
      LABTV
    </a>

    <div class="nav-links">

      <!-- HOME -->
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <!-- LOGIN -->
      <a
        *ngIf="!authService.isLoggedIn()"
        routerLink="/login"
        routerLinkActive="active">
        Login
      </a>

      <!-- ACQUISTI -->
      <a
        *ngIf="authService.isLoggedIn()"
        routerLink="/purchases"
        routerLinkActive="active">
        Acquisti
      </a>

      <!-- IL PROGETTO -->
      <a
        routerLink="/project"
        routerLinkActive="active">
        Il progetto
      </a>

      <!-- CONTATTI -->
      <a
        routerLink="/contacts"
        routerLinkActive="active">
        Contatti
      </a>

    </div>
  </div>

  <!-- UTENTE AUTENTICATO -->
  <div
    class="navbar-right"
    *ngIf="authService.isLoggedIn()">

    <span class="user-name">
      👤 {{ authService.getUser()?.name }}
    </span>

    <button
      type="button"
      class="logout-btn"
      (click)="logout()">
      Logout
    </button>

  </div>
</nav>
