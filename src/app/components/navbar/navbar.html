
<nav class="navbar">

  <div class="navbar-main">

    <!-- LOGO -->
    <a
      routerLink="/"
      class="brand"
      (click)="closeMenu()">
      LABTV
    </a>

    <!-- MENU DESKTOP -->
    <div class="nav-links">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <a
        *ngIf="!authService.isLoggedIn()"
        routerLink="/login"
        routerLinkActive="active">
        Login
      </a>

      <a
        *ngIf="authService.isLoggedIn()"
        routerLink="/purchases"
        routerLinkActive="active">
        Acquisti
      </a>

      <a
        routerLink="/project"
        routerLinkActive="active">
        Il progetto
      </a>

      <a
        routerLink="/contacts"
        routerLinkActive="active">
        Contatti
      </a>

    </div>

    <!-- UTENTE DESKTOP -->
    <div
      class="navbar-right"
      *ngIf="authService.isLoggedIn()">

      <span class="user-name">
        👤 {{ authService.getUser()?.name }}
      </span>

      <button
        type="button"
        class="logout-btn"
        (click)="logout()">
        Logout
      </button>

    </div>

    <!-- HAMBURGER MOBILE -->
    <button
      type="button"
      class="menu-toggle"
      [class.open]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-navigation"
      [attr.aria-label]="menuOpen ? 'Chiudi menu' : 'Apri menu'"
      (click)="toggleMenu()">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>

  <!-- MENU MOBILE CINEMATICO -->
  <div
    id="mobile-navigation"
    class="mobile-menu"
    [class.open]="menuOpen"
    [attr.aria-hidden]="!menuOpen"
    [attr.inert]="!menuOpen ? '' : null">

    <div class="mobile-menu-inner">

      <div class="mobile-menu-title">
        EXPLORE LABTV
      </div>

      <a
        routerLink="/"
        routerLinkActive="mobile-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">
        <span class="menu-icon">⌂</span>
        Home
      </a>

      <a
        *ngIf="!authService.isLoggedIn()"
        routerLink="/login"
        routerLinkActive="mobile-active"
        (click)="closeMenu()">
        <span class="menu-icon">↪</span>
        Login
      </a>

      <a
        *ngIf="authService.isLoggedIn()"
        routerLink="/purchases"
        routerLinkActive="mobile-active"
        (click)="closeMenu()">
        <span class="menu-icon">▣</span>
        Acquisti
      </a>

      <a
        routerLink="/project"
        routerLinkActive="mobile-active"
        (click)="closeMenu()">
        <span class="menu-icon">✦</span>
        Il progetto
      </a>

      <a
        routerLink="/contacts"
        routerLinkActive="mobile-active"
        (click)="closeMenu()">
        <span class="menu-icon">✉</span>
        Contatti
      </a>

      <!-- ACCOUNT MOBILE -->
      <div
        class="mobile-account"
        *ngIf="authService.isLoggedIn()">

        <span class="mobile-user-name">
          👤 {{ authService.getUser()?.name }}
        </span>

        <button
          type="button"
          class="logout-btn mobile-logout"
          (click)="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>

</nav>
